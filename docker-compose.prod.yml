# Compose de producción. El workflow lo copia a /home/ubuntu/cheturno/docker-compose.yml.
# No incluye secretos: los lee de .env (DB_USERNAME, DB_PASSWORD, JWT_SECRET, MAIL_PASSWORD), que vive solo en el servidor.
# IMAGE_TAG llega en image-tag.env (el SHA publicado en GHCR). No borra volúmenes.

name: cheturno

services:
  db:
    image: postgres:15-alpine
    container_name: cheturno-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: turnerodb
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d turnerodb"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/lohseagus/turneroweb-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/turnerodb
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # La imagen no trae credenciales SMTP. MAIL_USERNAME es opcional en .env.
      MAIL_USERNAME: ${MAIL_USERNAME:-soporte.cheturno@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEBUG: "false"
      # Apagado salvo que el .env lo pida para crear el primer SUPERADMIN de una instalación nueva.
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@turneroweb.com}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      APP_URL: https://cheturno.site
      APP_ALLOWED_ORIGINS: https://cheturno.site,https://www.cheturno.site
      SECURITY_DEV_MODE: "false"
      PORT: "8080"
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m"
      # Adjuntos de la historia clínica. El binario no va a Postgres.
      HCE_STORAGE_PATH: /var/cheturno/hce
    volumes:
      - hce_files:/var/cheturno/hce
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/lohseagus/turneroweb-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    name: cheturno_app

volumes:
  # Nombre real del volumen de Docker. Tiene que coincidir con el que ya existe
  # (proyecto compose "cheturno" + clave pgdata). Si no, el primer deploy crea una base vacía.
  pgdata:
    name: cheturno_pgdata
  caddy_data:
    name: cheturno_caddy_data
  caddy_config:
    name: cheturno_caddy_config
  # Estudios, imágenes y PDFs de la historia clínica. No borrarlo en un deploy.
  hce_files:
    name: cheturno_hce_files
