server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # woff2 ya viene comprimido; no lo volvemos a gzippear ni brotlear.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/xml;

  brotli on;
  brotli_comp_level 5;
  brotli_min_length 256;
  brotli_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    application/xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # El HTML de la SPA cambia en cada deploy. El resto de las rutas cae acá
  # por el try_files de arriba.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Bundles de Angular (main-HASH.js, styles-HASH.css) y el woff2 con hash
  # en el nombre. immutable es seguro porque el nombre cambia con el contenido.
  location ~* -[A-Za-z0-9]{8,}\.(?:js|mjs|css|woff2|woff)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
    types {
      text/css css;
      application/javascript js mjs;
      font/woff2 woff2;
      font/woff woff;
    }
    default_type application/octet-stream;
  }
}
