<div class="grafico-torta">
  @if (title || icon) {
    <div class="chart-header">
      <div class="chart-title-wrapper">
        @if (icon) {
          <span class="material-symbols-outlined">{{ icon }}</span>
        }
        @if (title) {
          <h6>{{ title }}</h6>
        }
      </div>
    </div>
  }

  <!-- Canvas cuando hay datos -->
  @if (hasData()) {
    <div class="chart-canvas-wrapper">
      <canvas baseChart
        [data]="chartData"
        [type]="'pie'">
      </canvas>
    </div>
  }

  <!-- Mensaje cuando no hay datos -->
  @if (!hasData()) {
    <div class="empty-state-chart">
      <span class="material-symbols-outlined">pie_chart_outline</span>
      <p>No hay registros disponibles</p>
    </div>
  }
</div>
