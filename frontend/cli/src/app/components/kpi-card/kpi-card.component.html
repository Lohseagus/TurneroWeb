<div class="kpi-card">
  <div class="kpi-content">
    @if (icon) {
      <div class="kpi-icon">
        <span class="material-symbols-outlined">{{ icon }}</span>
      </div>
    }
    <div class="kpi-body">
      <div class="kpi-title">{{ title }}</div>
      <div class="kpi-value">{{ value }}</div>
    </div>
    @if (delta !== null && delta !== undefined) {
      <div class="kpi-delta">
        <span class="delta-badge">{{ delta }}</span>
      </div>
    }
  </div>
</div>
