<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CheTurno - Gestion de Turnos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="stethoscope.ico">
  
  <!-- Google Fonts: Roboto (texto). Los iconos van self-hosted, ver el preload de abajo. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!--
    Material Symbols Outlined, subset local. font-display:block evita el flash
    del nombre ("location_on") mientras llega el woff2. El preload arranca la
    descarga junto con el HTML; crossorigin tiene que estar para que coincida
    con el fetch del @font-face y el navegador no lo baje dos veces.
  -->
  <link rel="preload" href="fonts/material-symbols-outlined-33BFB371.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Material Symbols Outlined";
      font-style: normal;
      font-weight: 100 700;
      font-display: block;
      src: url("fonts/material-symbols-outlined-33BFB371.woff2") format("woff2");
    }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      vertical-align: middle;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "liga", "rlig";
      -webkit-font-feature-settings: "liga", "rlig";
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
