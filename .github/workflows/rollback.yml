name: Rollback

# Vuelve a poner en el servidor un SHA que ya se publicó en GHCR. No corre tests ni mueve el tag latest.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo (40 hex) ya publicado en GHCR
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tiene que lanzarse con la rama master
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            echo "En Run workflow elegí la rama master (llegó ${{ github.ref }})."
            exit 1
          fi
          if ! [[ "${{ inputs.sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "El SHA tiene que ser el commit completo de 40 caracteres, el mismo con el que se tagueó la imagen."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Redesplegar ese SHA
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ inputs.sha }}
        run: bash deploy/gha-deploy.sh
