name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# En un PR se cancela la corrida anterior. En master no: no hay que cortar un deploy a la mitad.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Comprobar Maven
        run: |
          if ! command -v mvn >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          mvn -version

      - name: Compilar y correr tests
        run: |
          # Maven Central a veces responde 429 en un runner sin cache. Un fallo
          # de tests no se reintenta.
          for attempt in 1 2 3 4; do
            if mvn -B -ntp -f backend/pom.xml test > /tmp/mvn-test.log 2>&1; then
              cat /tmp/mvn-test.log
              exit 0
            fi
            cat /tmp/mvn-test.log
            if ! grep -q "429" /tmp/mvn-test.log; then
              exit 1
            fi
            echo "Maven Central respondió 429 (intento ${attempt}/4). Reintento."
            sleep $((attempt * 20))
          done
          exit 1

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: La API de producción es /api, sin doble prefijo
        run: bash scripts/check-prod-api-prefix.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/cli/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend/cli
        run: npm ci

      - name: Build de producción
        working-directory: frontend/cli
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build -- --configuration production

      - name: El bundle quedó en dist/cli/browser y no contiene /api/api
        working-directory: frontend/cli
        run: |
          test -f dist/cli/browser/index.html
          grep -q '<app-root' dist/cli/browser/index.html
          if grep -R --binary-files=text -q '/api/api' dist/cli/browser; then
            echo "El build de producción contiene el literal /api/api."
            exit 1
          fi

      # No hay target "test" en angular.json: los schematics tienen skipTests
      # y no existe ningún *.spec.ts. Cuando haya tests de Angular:
      #   npm test -- --watch=false --browsers=ChromeHeadless

  deploy:
    name: Deploy (master)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/lohseagus/turneroweb-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/lohseagus/turneroweb-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Desplegar por SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash deploy/gha-deploy.sh

      # latest se mueve recién acá: si el health check falló, el paso anterior ya cortó el job.
      - name: Marcar latest
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/lohseagus/turneroweb-backend:latest" \
            "ghcr.io/lohseagus/turneroweb-backend:${{ github.sha }}"
          docker buildx imagetools create \
            -t "ghcr.io/lohseagus/turneroweb-frontend:latest" \
            "ghcr.io/lohseagus/turneroweb-frontend:${{ github.sha }}"

      - name: Resumen
        run: |
          {
            echo "### Deploy"
            echo "SHA \`${{ github.sha }}\` en https://cheturno.site"
          } >> "$GITHUB_STEP_SUMMARY"
