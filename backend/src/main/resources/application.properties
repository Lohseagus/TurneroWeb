
# database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# devtools
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# JSON. En Jackson 3 las fechas son DateTimeFeature (spring.jackson.datatype.datetime).
spring.jackson.date-format=dd-MM-yyyy
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.datatype.datetime.write-date-timestamps-as-nanoseconds=false
spring.jackson.datatype.datetime.read-date-timestamps-as-nanoseconds=false

# JWT Configuration
# Sin valor por defecto. JWT_SECRET es obligatorio salvo con security.dev.mode=true,
# donde el backend genera una clave temporal en cada arranque.
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000


# Email Configuration
# Para desarrollo/testing con MailHog (comentado para usar Microsoft SMTP)
# spring.mail.host=mailhog
# spring.mail.port=1025
# spring.mail.username=noreply@hospital.com
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=false
# spring.mail.properties.mail.smtp.starttls.enable=false
# spring.mail.properties.mail.smtp.starttls.required=false
# spring.mail.properties.mail.smtp.ssl.enable=false
# spring.mail.test-connection=false

# Gmail SMTP configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:soporte.cheturno@gmail.com}
# Sin valor por defecto: la contraseña SMTP vive solo en el ambiente (MAIL_PASSWORD).
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.transport.protocol=smtp
# El debug de JavaMail vuelca la sesión SMTP completa al log. Prenderlo solo para diagnosticar.
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}


# Application Configuration for Email Templates
app.name=CheTurno
app.url=${APP_URL:http://localhost:4200}

# Password Reset Configuration
password.reset.token.expiration.minutes=1440
password.reset.max.tokens.per.user=3

# Activation Configuration
account.activation.token.expiration.minutes=2880
account.activation.max.tokens.per.user=3

# Admin Seed Configuration
# Apagado por defecto y sin contraseña en el repo. Para crear el primer SUPERADMIN de una
# instalación nueva: ADMIN_SEED_ENABLED=true y ADMIN_SEED_PASSWORD con 12 caracteres o más.
# Después del primer arranque conviene volver a apagarlo y quitar la contraseña del ambiente.
admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
admin.seed.email=${ADMIN_SEED_EMAIL:admin@turneroweb.com}
admin.seed.password=${ADMIN_SEED_PASSWORD:}
admin.seed.nombre=${ADMIN_SEED_NOMBRE:Administrador}
admin.seed.apellido=${ADMIN_SEED_APELLIDO:Sistema}
admin.seed.dni=${ADMIN_SEED_DNI:99999999}
admin.seed.telefono=${ADMIN_SEED_TELEFONO:+54-9-11-0000-0000}

# Turno Auto-Cancellation Configuration
turnos.auto-cancel.enabled=${TURNOS_AUTO_CANCEL_ENABLED:true}
turnos.auto-cancel.hours-before=${TURNOS_AUTO_CANCEL_HOURS:48}
turnos.auto-cancel.check-interval=${TURNOS_AUTO_CANCEL_INTERVAL:3600000}

# Security Configuration
# - false (por defecto): control de roles JWT aplicado.
# - true: modo desarrollo, todos los endpoints públicos. Hay que pedirlo de forma
#   explícita con SECURITY_DEV_MODE=true y solo en desarrollo local o e2e.
security.dev.mode=${SECURITY_DEV_MODE:false}

# CORS Configuration
# TODO: IMPLEMENTAR REVERSE PROXY CON NGINX PARA EVITAR EXPONER PUERTO 8080
# Solución correcta: Frontend en cheturno.site:80, proxy /api -> backend:8080 interno
# Esto eliminaría la necesidad de CORS y ocultaría el backend del acceso público
app.allowed.origins=${APP_ALLOWED_ORIGINS:http://localhost:4200,http://cheturno.site,https://cheturno.site}

# Google Client ID for OAuth2
google.client.id=792207143081-bjp6agdmp0a7aip4tq0ta35u1j50fuuk.apps.googleusercontent.com

# SaaS / facturación
# simulated (default) autoriza el pago en el acto. mercadopago deja el stub listo.
saas.payment.provider=${SAAS_PAYMENT_PROVIDER:simulated}
# Mercado Pago Subscriptions. Nunca commitear tokens: vienen solo de variables de entorno.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.api-base=${MP_API_BASE:https://api.mercadopago.com}

# Historia clínica: archivos en disco (en producción, volumen Docker)
hce.storage.path=${HCE_STORAGE_PATH:./data/hce}
hce.storage.max-bytes=${HCE_STORAGE_MAX_BYTES:10485760}

# Receta electrónica. local emite un identificador propio. renapdis deja el stub
# de una plataforma inscripta en ReNaPDiS (todavía sin credenciales ni red).
recetas.plataforma=${RECETAS_PLATAFORMA:local}
recetas.max-items=${RECETAS_MAX_ITEMS:3}
recetas.vigencia-dias=${RECETAS_VIGENCIA_DIAS:30}
recetas.orden-max-items=${ORDENES_MAX_ITEMS:8}
recetas.public-base-url=${RECETAS_PUBLIC_BASE_URL:${app.url}}
recetas.verificacion-por-minuto=${RECETAS_VERIFICACION_POR_MINUTO:30}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Survey Invitation Configuration
app.encuesta.invitacion.horas-envio-inicial=2
app.encuesta.invitacion.intervalo-reintento-horas=24
app.encuesta.invitacion.max-reintentos=2
app.encuesta.invitacion.limpieza-intervalo-horas=24